<div class="login-overlay" id="login-overlay" style ="display:none;">
    <div class="login-overlay__box">
        <h2 class="login-overlay__title">Login</h2>
        <form class="login-overlay__form" id="login-form">
            <div>
                <label class="login-overlay__label" for="username">Username</label>
                <input class="login-overlay__input" type="text" id="username" required>
            </div>
            <div>
                <label class="login-overlay__label" for="password">Password</label>
                <input class="login-overlay__input" type="password" id="password" required>
            </div>
            <p class="login-overlay__error" id="login-error"></p>
            <button class="login-overlay__submit" type="submit">Login</button>
        </form>
    </div>
</div>
